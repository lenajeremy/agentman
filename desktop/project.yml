# Agentman for Mac. Generate the Xcode project with:
#
#   cd desktop && xcodegen
#
# The .xcodeproj is generated, so it is not committed; this file is the
# project. See README.md.
name: Agentman
options:
  bundleIdPrefix: dev.agentman
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
packages:
  # Parses agents' markdown, GitHub tables included (Design/MarkdownView.swift).
  Markdown:
    url: https://github.com/swiftlang/swift-markdown
    from: 0.9.0
  # The terminal under the editor: a full emulator on a real pty
  # (Terminal/TerminalSession.swift). Held at 1.11: later releases need
  # Xcode's Metal toolchain and then a build plugin every builder must trust.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.11.2
targets:
  Agentman:
    type: application
    platform: macOS
    sources:
      - path: Agentman
    dependencies:
      - package: Markdown
      - package: SwiftTerm
    info:
      path: Agentman/Info.plist
      properties:
        CFBundleDisplayName: Agentman
        CFBundleName: Agentman
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "Agentman is open source under the MIT license."
        # agentman://agent/<session id> opens that agent: what Agentman's
        # cards and notifications link to.
        CFBundleURLTypes:
          - CFBundleURLName: dev.agentman.mac
            CFBundleURLSchemes: [agentman]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentman.mac
        PRODUCT_NAME: Agentman
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The app talks to `am serve` through ~/.agentman/am.sock, which a
        # sandboxed app cannot reach. It is distributed outside the App Store.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
  AgentmanTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AgentmanTests
    dependencies:
      - target: Agentman
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentman.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Agentman.app/Contents/MacOS/Agentman"
schemes:
  Agentman:
    build:
      targets:
        Agentman: all
        AgentmanTests: [test]
    test:
      targets:
        - AgentmanTests
