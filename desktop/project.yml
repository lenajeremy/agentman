# Agentman for Mac. Generate the Xcode project with:
#
#   cd desktop && xcodegen
#
# The .xcodeproj is generated, so it is not committed; this file is the
# project. See README.md.
name: Agentman
options:
  bundleIdPrefix: dev.agentman
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.41.1"
    CURRENT_PROJECT_VERSION: "47"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
packages:
  # Parses agents' markdown, GitHub tables included (Design/MarkdownView.swift).
  Markdown:
    url: https://github.com/swiftlang/swift-markdown
    from: 0.9.0
  # The terminal under the editor: a full emulator on a real pty
  # (Terminal/TerminalSession.swift). Held at 1.11: later releases need
  # Xcode's Metal toolchain and then a build plugin every builder must trust.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.11.2
  # The app updates itself (App/AppUpdater.swift): it reads the appcast on
  # the site, and checks what it downloads against the key in SUPublicEDKey.
  # A binary package, so it brings the signing tools scripts/release-mac.sh
  # uses (SourcePackages/artifacts/sparkle/Sparkle/bin).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1
targets:
  Agentman:
    type: application
    platform: macOS
    sources:
      - path: Agentman
        excludes:
          - Resources/EditorWeb
          - Resources/EditorWeb/**
      # The editor page (Monaco), built from editor-web/ before each build and
      # copied in as a folder, so its files keep their places.
      - path: Agentman/Resources/EditorWeb
        type: folder
        buildPhase: resources
        optional: true
    preBuildScripts:
      - name: Build the editor page
        script: '"$SRCROOT/editor-web/build.sh"'
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Agentman/Resources/EditorWeb/main.js
    postBuildScripts:
      # am, built from this repository into Contents/Helpers and signed as
      # the app is (scripts/build-am.sh): the app sets everything up with it
      # on first launch. Last, so Xcode signs the app around it. Run every
      # time; Go's build cache makes an unchanged am a moment's work.
      - name: Build am
        script: '"$SRCROOT/scripts/build-am.sh"'
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/am
    dependencies:
      - package: Markdown
      - package: SwiftTerm
      - package: Sparkle
    info:
      path: Agentman/Info.plist
      properties:
        CFBundleDisplayName: Agentman
        CFBundleName: Agentman
        # From the build settings below, which XcodeGen would otherwise
        # replace with 1.0 (1).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "Agentman is open source under the MIT license."
        # Voice prompts: what the user says is written out by Celery.
        NSMicrophoneUsageDescription: "Agentman listens while you record with the mic button, so you can speak a message to an agent or to Agentman instead of typing it. Celery writes it out."
        # agentman://agent/<session id> opens that agent: what Agentman's
        # cards and notifications link to.
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [$(AGENTMAN_URL_SCHEME)]
        # Updates (App/AppUpdater.swift): where Sparkle looks for a newer
        # version, and the public half of the key every release is signed
        # with. The private half never leaves the release Mac's login
        # Keychain, where `generate_keys --account agentman` put it;
        # scripts/release-mac.sh signs with it. Without SUEnableAutomaticChecks
        # Sparkle asks once, on the second launch, whether to check by itself.
        SUFeedURL: https://agentman-nu.vercel.app/appcast.xml
        SUPublicEDKey: Wkd9F/65lovmZQN7p6GxBiG6sXy6LM7KPF3ILNAd8+k=
        # Updating to match a newer am serve, once the user has said yes
        # (App/AppCatchUp.swift), downloads in the background and installs
        # at quit. Sparkle allows that only with automatic checks on unless
        # this says it may, so it does, whatever was answered to its prompt.
        SUAllowsAutomaticUpdates: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentman.mac
        PRODUCT_NAME: Agentman
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The app talks to `am serve` through ~/.agentman/am.sock, which a
        # sandboxed app cannot reach. It is distributed outside the App Store.
        ENABLE_APP_SANDBOX: NO
        # The editor page's build reads node_modules and writes Resources.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Agentman/Agentman.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        AGENTMAN_URL_SCHEME: agentman
      configs:
        # Debug builds, the tests' host among them, are an app of their own:
        # sharing the released app's id, they shared its settings, so a test
        # that opened a panel opened it in the user's running Agentman, and
        # agentman:// links could open a build in DerivedData.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.agentman.mac.debug
          AGENTMAN_URL_SCHEME: agentman-debug
  AgentmanTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AgentmanTests
    dependencies:
      - target: Agentman
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.agentman.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Agentman.app/Contents/MacOS/Agentman"
schemes:
  Agentman:
    build:
      targets:
        Agentman: all
        AgentmanTests: [test]
    test:
      targets:
        - AgentmanTests
