# Release automation.
#
# Replaces a hand-run sequence that was easy to get wrong: cross-compile four
# binaries, tar them, compute SHA-256s by hand, paste those into a formula in a
# second repository, and cut a release. The hashes were the dangerous part —
# transcribe one wrong and `brew install` fails with a checksum mismatch that
# says nothing about the cause.
#
# Cut a release by pushing a tag:
#
#     git tag v0.2.0 && git push origin v0.2.0
version: 2

project_name: agentman

before:
  hooks:
    # A tagged build is the one nobody reviews before it ships, so it is the
    # one that most needs the tests to have run.
    - go test ./...

builds:
  # Only the daemon is distributed. The relay is deployed as a container and
  # the app ships through Expo, so neither belongs in a Homebrew formula.
  - id: am
    main: ./cmd/am
    # The command is `am`; without this GoReleaser names the binary after the
    # project and the cask installs something the docs never mention.
    binary: am
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      # Without this the binary cannot report its own version, which matters
      # most for `brew install` where the user did not build it themselves.
      - -s -w -X main.version={{ .Version }}
    # Reproducible: strip local paths and pin the timestamp to the commit.
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"

# macOS remembers what a program may do by who signed it. Unsigned, each new
# release of am can look like a new program, and the user is asked again for
# everything they had allowed. Signed and notarized once the release has the
# certificate (the MACOS_* secrets in release.yml); until then a release ships
# unsigned, as before, rather than failing.
notarize:
  macos:
    - enabled: '{{ ne (envOrDefault "MACOS_SIGN_P12" "") "" }}'
      ids: [am]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - id: am
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Homebrew ships as a Cask rather than a Formula: GoReleaser deprecated the
# Formula path for prebuilt binaries, and a Cask is the supported way to
# distribute something already compiled. Homebrew installs casks on Linux
# too, linking a cask's `binary` as it does on macOS, and Linux is where `am`
# most often runs without the app, so one cask serves both.
#
# It is named agentman-cli because `agentman` is Agentman for Mac's cask
# (written by scripts/release-mac.sh): `brew install --cask agentman` is the
# app, `brew install agentman-cli` is `am` alone, for remote Macs and Linux.
# Installs from before the split, under `agentman`, move to this name through
# the tap's cask_renames.json (docs/development.md, "Homebrew").
homebrew_casks:
  - name: agentman-cli
    # The archive contains `am`; without naming it here the cask defaults to
    # the project name and tries to link a file that does not exist.
    binaries:
      - am
    homepage: https://github.com/lenajeremy/agentman
    description: Watch your coding agents from your phone and answer them when they get stuck
    repository:
      owner: lenajeremy
      name: homebrew-agentman
      # GITHUB_TOKEN is scoped to this repository, so publishing to the tap
      # needs its own token with write access there.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # Required to send messages to Claude Code or Codex and to answer the
    # prompts that block them — the headline feature on two of three agents.
    # Homebrew serves a prebuilt bottle, so this costs a download, not a build.
    dependencies:
      - formula: tmux
    # The binary is downloaded rather than built locally and is not notarized,
    # so Gatekeeper quarantines it and macOS kills it on the first run —
    # verified by installing this same tarball without the step: the binary
    # carries com.apple.quarantine and `am version` prints nothing at all.
    # Stripping the attribute is what makes an unsigned cask usable.
    #
    # Written through custom_block rather than `hooks.post.install`, which
    # GoReleaser still emits as Homebrew's deprecated `postflight` stanza (true
    # as of v2.18.2). custom_block lands at the top of the cask, above
    # `version`, which Homebrew accepts. `run` resolves args relative to chdir
    # rather than expanding a staged_path string, so the path is "." plus a
    # bare binary name. Fold this back into hooks.post.install once GoReleaser
    # emits postflight_steps itself.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "am"], chdir: "."
        end
      end
    caveats: |
      Get started:

        am install-hooks
        am serve
        am pair

      Then launch agents through the wrapper so you can message them back:

        am claude
        am codex

      `am` uses the public relay by default. It has no transcript database but
      can observe live traffic. To run your own, see
      https://github.com/lenajeremy/agentman/blob/main/docs/self-hosting.md

release:
  # A re-run after a partial failure must be able to overwrite what the first
  # attempt uploaded. Without this, fixing the tap token and retrying fails at
  # asset upload instead, because the release already holds those files.
  mode: replace
  footer: |
    ## Install

    The command-line tool, `am`, on macOS or Linux:

    ```bash
    brew install lenajeremy/agentman/agentman-cli
    ```
