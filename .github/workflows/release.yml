# Cuts a release when a version tag is pushed:
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# Builds every platform, publishes the GitHub release, opens the formula
# update on the Homebrew tap with checksums it computed itself, and publishes
# the same binaries to npm as agentman (see scripts/npm-release.mjs).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # npm provenance: the registry records that these packages were built here,
  # from this tag.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # At job level so the npm steps' `if` can see whether it is set; a
      # step's own env is not visible to its condition.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser builds the changelog from history, which a shallow
          # clone does not have.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # A release tag can bypass the branch CI run, so repeat the complete Go
      # verification here before publishing immutable binaries.
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - run: go test -race ./...

      # The web app's screens ship beside am, not inside it
      # (internal/webapp/fetch.go): built here and packed as one file, which
      # GoReleaser attaches to the release, and whose SHA-256 it stamps into
      # every am. am serve fetches it the first time `am web` runs, and uses
      # it only if it matches.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build the web app
        run: |
          (cd web && npm ci && npm run build)
          mkdir -p dist-web
          bundle="dist-web/agentman-web_${GITHUB_REF_NAME}.tar.gz"
          tar -C internal/webapp/dist -czf "$bundle" .
          echo "WEB_SHA256=$(sha256sum "$bundle" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "v2.17.1"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Scoped to this repo only, so publishing to the tap repository
          # needs a separate token with write access to it.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Sign and notarize the macOS builds (.goreleaser.yaml), once these
          # are set. Without them a release still ships, unsigned.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

      # npm gets the binaries GoReleaser just built and released, one package
      # per platform plus agentman itself. Skipped until an NPM_TOKEN secret
      # exists, so a release without it still ships everywhere else.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.NPM_TOKEN != ''
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: node scripts/npm-release.mjs "$GITHUB_REF_NAME" dist --publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
