# Cuts a release when a version tag is pushed:
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# Builds every platform, publishes the GitHub release, and opens the formula
# update on the Homebrew tap with checksums it computed itself.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser builds the changelog from history, which a shallow
          # clone does not have.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true

      # A release tag can bypass the branch CI run, so repeat the complete Go
      # verification here before publishing immutable binaries.
      - run: go vet ./...
      - run: go test -race ./...

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "v2.17.1"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Scoped to this repo only, so publishing to the tap repository
          # needs a separate token with write access to it.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
